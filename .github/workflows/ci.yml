name: CI/CD Pipeline - Traceability System PT. Santos Jaya Abadi

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  system-validation:
    name: System Integrity & Automated Monitoring
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: db_traceability_sja
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: |
          npm install

      - name: 4. Initialize Database Schema (9 Production Tables)
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root db_traceability_sja < schema.sql
          echo "✅ Skema 9 tabel produksi berhasil diinisialisasi ke container MySQL."

      - name: 5. Syntax & Static Lint Verification
        run: |
          echo "🔍 Memeriksa integritas sintaksis server JavaScript..."
          node -c server/index.js
          node -c server/db.js
          node -c server/tableConfig.js
          node -c server/routes/import.js
          node -c server/routes/trace.js
          echo "✅ Seluruh file server valid secara sintaksis."

      - name: 6. Run Automated Test Suite (Calculations & Monitoring)
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: db_traceability_sja
        run: |
          echo "🚀 Menjalankan test suite traceability..."
          npm test
          echo "✅ Seluruh pengujian integritas sistem berhasil lulus."
