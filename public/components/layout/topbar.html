    <!-- Topbar Header -->
    <header id="app-topbar" class="h-14 bg-white border-b border-slate-200 no-print flex items-center justify-between px-4 sm:px-6 z-40 shadow-2xs flex-shrink-0 sticky top-0 overflow-hidden">
      <div class="flex items-center gap-3 min-w-0 overflow-hidden">
        <div class="flex items-center gap-2 min-w-0">
          <!-- Tombol Kembali ke Direktori Work Order (Hanya tampil saat sesi aktif dibuka di tab pipeline) -->
          <button
            v-if="activeTab === 'pipeline' && activeSessionId"
            type="button"
            @click="backToWorkOrderList"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs transition-all cursor-pointer group shrink-0 mr-1 border border-slate-200"
            title="Kembali ke Direktori Work Order"
          >
            <svg class="w-3.5 h-3.5 text-slate-600 transition-transform group-hover:-translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span>Kembali ke Direktori</span>
          </button>

          <span class="text-sm font-black uppercase tracking-wider text-slate-900 whitespace-nowrap">
            {{
              activeTab === 'dashboard' ? 'Dashboard' :
              activeTab === 'pipeline' ? 'Batch Traceability' :
              activeTab === 'report' ? 'Audit Report' :
              activeTab === 'sync' ? 'Data Ingestion' : 'Data Explorer'
            }}
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2 text-xs flex-shrink-0">
        <!-- Industrial Telemetry & Real-Time Operational Clock (Linear "LIVE" Aesthetic) -->
        <div
          class="hidden md:flex items-center gap-2 px-2.5 py-1 rounded-lg border transition-all select-none mr-1"
          :class="dbConnected ? 'bg-white border-cyan-200 text-cyan-900' : 'bg-rose-50/95 border-rose-300 text-rose-900'"
        >
          <!-- Sleek Linear Monospace LIVE / OFFLINE Tag -->
          <div
            class="flex items-center gap-1.5 pr-2.5 border-r"
            :class="dbConnected ? 'border-stone-200' : 'border-rose-200'"
            :title="dbConnected ? 'Koneksi Database MySQL Aktif (Plant Sukodono)' : 'Koneksi Database MySQL Terputus / Offline'"
          >
            <span
              class="px-2 py-0.5 rounded-md font-mono text-[10px] font-black tracking-wider uppercase transition-all inline-flex items-center gap-1.5"
              :class="dbConnected ? 'bg-emerald-50 text-emerald-600 border border-emerald-300 shadow-2xs' : 'bg-rose-50 text-rose-600 border border-rose-300 shadow-2xs animate-pulse'"
            >
              <span class="w-1.5 h-1.5 rounded-full inline-block" :class="dbConnected ? 'bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.7)]' : 'bg-rose-500 shadow-[0_0_6px_rgba(244,63,94,0.7)]'"></span>
              <span>{{ dbConnected ? 'LIVE' : 'OFFLINE' }}</span>
            </span>

          </div>

          <!-- Monospace Real-Time Clock & Date -->
          <div class="flex items-center gap-1.5 font-mono text-xs font-bold text-slate-800">
            <svg class="w-3.5 h-3.5 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="tracking-tight">{{ currentTimeStr }}</span>
            <span class="text-[10px] text-slate-400 font-sans hidden lg:inline" :title="currentDateStr">
              WIB
            </span>
          </div>

          <!-- Active Shift Badge -->
          <span
            class="px-2 py-0.5 rounded-lg text-[10px] font-bold tracking-wide border shadow-2xs transition-colors"
            :class="currentShift.badgeClass"
            :title="'Shift Kerja Operasional: ' + currentShift.timeRange"
          >
            {{ currentShift.name }}
          </span>
        </div>

        <!-- User Profile Trigger (Clean & Uncolored) -->
        <button
          type="button"
          @click="openLoginModal"
          class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-cyan-300 bg-white hover:bg-cyan-50 cursor-pointer transition-all group"
          :title="'Akun Pengguna (' + (authUser?.full_name || 'Super Admin SJA') + ')'"
        >
          <svg class="w-4 h-4 text-stone-700 group-hover:text-stone-950 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="text-xs font-bold text-slate-800 max-w-[140px] truncate">
            {{ authUser?.full_name || 'Super Admin SJA' }}
          </span>
          <svg class="w-3.5 h-3.5 text-stone-500 group-hover:text-stone-800 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </div>
    </header>
