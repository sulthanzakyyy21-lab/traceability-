  <script>
    /* ── Auto-DPI Normalizer: Mengunci visual density agar selalu setara Scale 125% ── */
    (function () {
      function normalizeDisplayDpi() {
        var dpr = window.devicePixelRatio || 1;
        // Jika layar menggunakan scale 150% (DPR ~1.5) atau lebih besar,
        // kalibrasi zoom root HTML agar kanvas render persis setara scale 125%
        if (dpr > 1.28) {
          var targetZoom = 1.25 / dpr;
          document.documentElement.style.zoom = targetZoom;
          document.documentElement.style.setProperty('--app-zoom', targetZoom);
        } else {
          document.documentElement.style.zoom = '1';
          document.documentElement.style.setProperty('--app-zoom', '1');
        }

        // Sinkronisasi warna canvas latar agar tidak ada celah putih
        try {
          var isAuth = localStorage.getItem('sja_auth_token') || localStorage.getItem('auth_token') || localStorage.getItem('auth_user');
          if (isAuth) {
            document.documentElement.classList.add('logged-in');
            if (document.body) document.body.classList.add('logged-in');
          } else {
            document.documentElement.classList.remove('logged-in');
            if (document.body) document.body.classList.remove('logged-in');
          }
        } catch (e) {}
      }
      normalizeDisplayDpi();
      window.addEventListener('resize', normalizeDisplayDpi);
    })();
  </script>
